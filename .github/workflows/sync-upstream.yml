name: Sync Upstream Horizon

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: '即使上游没有新提交也强制触发一次编译'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-upstream:
    name: Check Upstream Updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      repo: ${{ steps.sync.outputs.repo }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: sync
        shell: bash
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          source upstream.lock
          REPO="${UPSTREAM_REPO:-horizon-rust/horizon}"
          BRANCH="${UPSTREAM_BRANCH:-main}"
          CURRENT_REF="${UPSTREAM_REF:-}"

          LATEST_SHA="$(git ls-remote "https://github.com/${REPO}.git" "refs/heads/${BRANCH}" | awk 'NR==1 {print $1}')"
          if [[ -z "$LATEST_SHA" ]]; then
            echo "::error::无法解析上游 ${REPO} 分支 ${BRANCH}"
            exit 1
          fi

          echo "Current: ${CURRENT_REF}"
          echo "Latest:  ${LATEST_SHA}"

          if [[ "$CURRENT_REF" != "$LATEST_SHA" ]]; then
            cat > upstream.lock <<EOF
          UPSTREAM_REPO=${REPO}
          UPSTREAM_BRANCH=${BRANCH}
          UPSTREAM_REF=${LATEST_SHA}
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add upstream.lock
            git commit -m "chore: sync upstream ${REPO}@${LATEST_SHA:0:8}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FORCE_BUILD" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=${LATEST_SHA}" >> "$GITHUB_OUTPUT"

  trigger-build:
    name: Trigger Full Build
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    uses: ./.github/workflows/build-arm64.yml
    with:
      upstream_repo: ${{ needs.check-upstream.outputs.repo }}
      upstream_ref: ${{ needs.check-upstream.outputs.sha }}
      build_amd64: true
      build_arm64: true
      build_sdk: true
      publish_release: true
    permissions:
      contents: write
