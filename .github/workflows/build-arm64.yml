name: 编译 Horizon Linux (AMD64 + ARM64 + 原生 Mod SDK)

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '源码仓库（留空则读取 upstream.lock，支持官方或自改 fork 如 用户名/horizon）'
        required: false
        default: ''
      upstream_ref:
        description: '分支、Tag 或 Commit SHA（留空则读取 upstream.lock）'
        required: false
        default: ''
      build_amd64:
        description: '编译 Linux x86_64 (AMD64) 服务端与 SDK'
        type: boolean
        default: true
      build_arm64:
        description: '编译 Linux aarch64 (ARM64) 服务端与 SDK'
        type: boolean
        default: true
      build_sdk:
        description: '编译原生 Mod SDK（build-data, surface, api-source, sdk.json 等）'
        type: boolean
        default: true
      build_client_sdk:
        description: '包含客户端 SDK 切片（如果为 false 则仅构建 -server 切片）'
        type: boolean
        default: true
      publish_release:
        description: '将产物发布到 GitHub Release'
        type: boolean
        default: true
      tag_prefix:
        description: 'Release Tag 前缀（与官方一致推荐 sdk-）'
        required: false
        default: 'sdk-'
      arm_runner:
        description: 'ARM64 Runner 镜像'
        type: choice
        default: ubuntu-26.04-arm
        options:
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
      x86_runner:
        description: 'AMD64 Runner 镜像'
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-22.04
  push:
    branches: [main]
    paths:
      - 'upstream.lock'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-arm64.yml'
  workflow_call:
    inputs:
      upstream_repo:
        type: string
        required: false
        default: ''
      upstream_ref:
        type: string
        required: false
        default: ''
      build_amd64:
        type: boolean
        required: false
        default: true
      build_arm64:
        type: boolean
        required: false
        default: true
      build_sdk:
        type: boolean
        required: false
        default: true
      build_client_sdk:
        type: boolean
        required: false
        default: true
      publish_release:
        type: boolean
        required: false
        default: true
      tag_prefix:
        type: string
        required: false
        default: 'sdk-'
      arm_runner:
        type: string
        required: false
        default: ubuntu-26.04-arm
      x86_runner:
        type: string
        required: false
        default: ubuntu-24.04

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve:
    name: 解析上游版本与配置
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repo: ${{ steps.meta.outputs.repo }}
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
      rust_version: ${{ steps.meta.outputs.rust_version }}
      tag: ${{ steps.meta.outputs.tag }}
      upstream_nightly: ${{ steps.meta.outputs.upstream_nightly }}
      upstream_date: ${{ steps.meta.outputs.upstream_date }}
      build_amd64: ${{ steps.meta.outputs.build_amd64 }}
      build_arm64: ${{ steps.meta.outputs.build_arm64 }}
      build_sdk: ${{ steps.meta.outputs.build_sdk }}
      build_client_sdk: ${{ steps.meta.outputs.build_client_sdk }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      arm_runner: ${{ steps.meta.outputs.arm_runner }}
      x86_runner: ${{ steps.meta.outputs.x86_runner }}
    steps:
      - name: 检出本仓库上下文
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 解析提交版本与 Nightly 标识
        id: meta
        shell: bash
        env:
          INPUT_REPO: ${{ inputs.upstream_repo }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          INPUT_AMD64: ${{ inputs.build_amd64 }}
          INPUT_ARM64: ${{ inputs.build_arm64 }}
          INPUT_SDK: ${{ inputs.build_sdk }}
          INPUT_CLIENT_SDK: ${{ inputs.build_client_sdk }}
          INPUT_RELEASE: ${{ inputs.publish_release }}
          INPUT_TAG_PREFIX: ${{ inputs.tag_prefix }}
          INPUT_ARM_RUNNER: ${{ inputs.arm_runner }}
          INPUT_X86_RUNNER: ${{ inputs.x86_runner }}
        run: |
          set -euo pipefail
          source upstream.lock
          REPO="${INPUT_REPO:-${UPSTREAM_REPO:-horizon-rust/horizon}}"
          REF="${INPUT_REF:-${UPSTREAM_REF:-main}}"
          ARM_RUNNER="${INPUT_ARM_RUNNER:-ubuntu-26.04-arm}"
          X86_RUNNER="${INPUT_X86_RUNNER:-ubuntu-24.04}"
          TAG_PREFIX="${INPUT_TAG_PREFIX:-sdk-}"

          # 获取提交哈希
          SHA="$(git ls-remote "https://github.com/${REPO}.git" "$REF" | awk 'NR==1 {print $1}')"
          if [[ -z "$SHA" ]]; then
            SHA="$REF"
          fi
          SHORT_SHA="${SHA:0:8}"
          DATE_TAG="$(date -u +%Y.%m.%d)"
          VERSION="${DATE_TAG}-${SHORT_SHA}"
          RELEASE_TAG="${TAG_PREFIX}${SHORT_SHA}"

          # 解析上游提交时间与标准 Nightly 格式（例如 Nightly 2026-11-22 · f1bb66f）
          python3 -c "
          from datetime import datetime, timezone
          import json, urllib.request

          sha = '$SHA'
          repo = '$REPO'
          nightly_title = f'Nightly $DATE_TAG · $SHORT_SHA'
          nightly_date = '$DATE_TAG UTC'
          try:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/commits/{sha}', headers={'User-Agent': 'gh-actions'})
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
                  d_str = data['commit']['committer']['date']
                  dt = datetime.fromisoformat(d_str.replace('Z', '+00:00'))
                  nightly_title = f'Nightly {dt.strftime(\"%Y-%m-%d\")} · {sha[:7]}'
                  nightly_date = dt.strftime('%b %d, %Y · %H:%M UTC')
          except Exception:
              dt = datetime.now(timezone.utc)
              nightly_title = f'Nightly {dt.strftime(\"%Y-%m-%d\")} · {sha[:7]}'
              nightly_date = dt.strftime('%b %d, %Y · %H:%M UTC')

          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'upstream_nightly={nightly_title}\n')
              f.write(f'upstream_date={nightly_date}\n')
          "

          # 获取上游固定的 Rust 版本
          RUST_VER="$(curl -fsSL "https://raw.githubusercontent.com/${REPO}/${SHA}/tools/ci/rust-version" 2>/dev/null | tr -d '[:space:]' || echo "1.85.0")"

          {
            echo "repo=$REPO"
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "version=$VERSION"
            echo "rust_version=$RUST_VER"
            echo "tag=$RELEASE_TAG"
            echo "build_amd64=${INPUT_AMD64:-true}"
            echo "build_arm64=${INPUT_ARM64:-true}"
            echo "build_sdk=${INPUT_SDK:-true}"
            echo "build_client_sdk=${INPUT_CLIENT_SDK:-true}"
            echo "publish_release=${INPUT_RELEASE:-true}"
            echo "arm_runner=$ARM_RUNNER"
            echo "x86_runner=$X86_RUNNER"
          } >> "$GITHUB_OUTPUT"

          echo "目标仓库: ${REPO}@${SHA} (Tag: ${RELEASE_TAG}, Rust ${RUST_VER})"

      - name: 初始化 GitHub Release 桩 (支持产物实时流式上传)
        if: steps.meta.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: "Horizon Server & SDK · ${{ steps.meta.outputs.upstream_nightly }}"
          UPSTREAM_REPO: ${{ steps.meta.outputs.repo }}
          UPSTREAM_SHA: ${{ steps.meta.outputs.sha }}
          UPSTREAM_NIGHTLY: ${{ steps.meta.outputs.upstream_nightly }}
          UPSTREAM_DATE: ${{ steps.meta.outputs.upstream_date }}
          RUST_VER: ${{ steps.meta.outputs.rust_version }}
        run: |
          NOTES=$(printf "基于上游 [%s@%s](https://github.com/%s/commit/%s) 自动构建发布。\n\n- **上游版本基线**：\`%s\`\n- **上游提交时间**：\`%s\`\n- **Rust 编译工具链**：\`%s\`\n- **分发状态**：⚡ **实时流式上传中**（各架构二进制与 SDK 切片编译完成即刻自动推送到本 Release，无需等待全部任务完成即可直接下载）\n" \
            "$UPSTREAM_REPO" "$UPSTREAM_SHA" "$UPSTREAM_REPO" "$UPSTREAM_SHA" "$UPSTREAM_NIGHTLY" "$UPSTREAM_DATE" "$RUST_VER")

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GH_REPO" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GH_REPO" --title "$TITLE" --notes "$NOTES"
          fi

  build-binaries:
    name: 编译二进制 (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.arch == 'arm64' && needs.resolve.outputs.arm_runner || needs.resolve.outputs.x86_runner }}
    if: |
      needs.resolve.outputs.build_amd64 == 'true' ||
      needs.resolve.outputs.build_arm64 == 'true'
    timeout-minutes: 90
    steps:
      - name: 检查当前架构是否激活
        id: check
        run: |
          ACTIVE=false
          if [[ "${{ matrix.arch }}" == "x86_64" && "${{ needs.resolve.outputs.build_amd64 }}" == "true" ]]; then
            ACTIVE=true
          fi
          if [[ "${{ matrix.arch }}" == "arm64" && "${{ needs.resolve.outputs.build_arm64 }}" == "true" ]]; then
            ACTIVE=true
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      - name: 扩展 Linux 交换分区 (Swap) 防止大工程内存溢出
        if: steps.check.outputs.active == 'true'
        run: |
          sudo fallocate -l 8G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true
          free -h

      - name: 检出本仓库脚本与补丁
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.active == 'true'

      - name: 检出上游源码 (${{ needs.resolve.outputs.short_sha }})
        if: steps.check.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.repo }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: 应用下游自定义补丁
        if: steps.check.outputs.active == 'true'
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh upstream patches

      - name: 安装 Rust 工具链 (${{ needs.resolve.outputs.rust_version }})
        if: steps.check.outputs.active == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ needs.resolve.outputs.rust_version }}

      - name: 缓存 Cargo 依赖与构建产物
        if: steps.check.outputs.active == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: upstream
          shared-key: ${{ matrix.arch }}-binaries-${{ needs.resolve.outputs.rust_version }}

      - name: 安装系统编译依赖库
        if: steps.check.outputs.active == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libssl-dev libasound2-dev libudev-dev

      - name: 编译专用服与客户端套件
        if: steps.check.outputs.active == 'true'
        run: |
          chmod +x scripts/build-binaries.sh
          ./scripts/build-binaries.sh upstream dist/binaries "${{ needs.resolve.outputs.version }}" "${{ matrix.arch }}"

      - name: 实时发布当前架构二进制至 GitHub Release
        if: steps.check.outputs.active == 'true' && needs.resolve.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          echo "==> [实时上传] 正在上传 ${{ matrix.arch }} 架构二进制产物至 Release $TAG..."
          gh release upload "$TAG" dist/binaries/*.tar.gz --repo "$GH_REPO" --clobber

      - name: 上传当前架构二进制构件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.active == 'true'
        with:
          name: horizon-binaries-${{ matrix.arch }}
          path: dist/binaries/*.tar.gz
          if-no-files-found: error
          retention-days: 3

  build-sdk-slices:
    name: 编译 SDK 切片 (${{ matrix.leg }})
    needs: resolve
    if: needs.resolve.outputs.build_sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-x86_64-server
            arch: x86_64
            server: true
          - leg: linux-x86_64
            arch: x86_64
            server: false
          - leg: linux-arm64-server
            arch: arm64
            server: true
          - leg: linux-arm64
            arch: arm64
            server: false
    runs-on: ${{ matrix.arch == 'arm64' && needs.resolve.outputs.arm_runner || needs.resolve.outputs.x86_runner }}
    timeout-minutes: 120
    steps:
      - name: 检查当前切片是否激活
        id: check
        run: |
          BUILD_ARCH=false
          if [[ "${{ matrix.arch }}" == "x86_64" && "${{ needs.resolve.outputs.build_amd64 }}" == "true" ]]; then
            BUILD_ARCH=true
          fi
          if [[ "${{ matrix.arch }}" == "arm64" && "${{ needs.resolve.outputs.build_arm64 }}" == "true" ]]; then
            BUILD_ARCH=true
          fi

          BUILD_LEG=false
          if [[ "$BUILD_ARCH" == "true" ]]; then
            if [[ "${{ matrix.server }}" == "true" || "${{ needs.resolve.outputs.build_client_sdk }}" == "true" ]]; then
              BUILD_LEG=true
            fi
          fi
          echo "active=$BUILD_LEG" >> "$GITHUB_OUTPUT"

      - name: 扩展 Linux 交换分区 (Swap) 防止 SDK 编译内存溢出 (OOM 143)
        if: steps.check.outputs.active == 'true'
        run: |
          sudo fallocate -l 8G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true
          free -h

      - name: 检出本仓库脚本与补丁
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.active == 'true'

      - name: 检出上游源码 (${{ needs.resolve.outputs.short_sha }})
        if: steps.check.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.repo }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: 应用下游自定义补丁
        if: steps.check.outputs.active == 'true'
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh upstream patches

      - name: 安装 Rust 工具链 (${{ needs.resolve.outputs.rust_version }})
        if: steps.check.outputs.active == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ needs.resolve.outputs.rust_version }}

      - name: 配置 Python 3.12 环境
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.active == 'true'
        with:
          python-version: '3.12'

      - name: 缓存 Cargo 依赖与构建产物 (prebuilt & tools)
        if: steps.check.outputs.active == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            upstream -> target/prebuilt
            upstream -> target/prebuilt/tools
          shared-key: ${{ matrix.leg }}-sdk-${{ needs.resolve.outputs.rust_version }}

      - name: 安装系统编译依赖库
        if: steps.check.outputs.active == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libssl-dev libasound2-dev libudev-dev

      - name: 编译并打包当前平台 SDK 切片
        if: steps.check.outputs.active == 'true'
        run: |
          chmod +x scripts/build-sdk.sh
          mkdir -p dist
          ./scripts/build-sdk.sh upstream dist ${{ matrix.server && '--server' || '--client' }}

      - name: 实时发布当前平台 SDK 切片至 GitHub Release
        if: steps.check.outputs.active == 'true' && needs.resolve.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          echo "==> [实时上传] 正在上传 ${{ matrix.leg }} SDK 切片至 Release $TAG..."
          gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber

      - name: 上传当前平台 SDK 切片构件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.active == 'true'
        with:
          name: sdk-leg-${{ matrix.leg }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  index-sdk:
    name: 汇总切片、打包 API 源码与生成 sdk.json
    needs: [resolve, build-sdk-slices]
    if: |
      always() &&
      needs.resolve.outputs.build_sdk == 'true' &&
      (needs.build-sdk-slices.result == 'success')
    runs-on: ${{ needs.resolve.outputs.x86_runner }}
    timeout-minutes: 60
    steps:
      - name: 检出本仓库脚本与补丁
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 检出上游源码 (${{ needs.resolve.outputs.short_sha }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve.outputs.repo }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: 应用下游自定义补丁
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh upstream patches

      - name: 安装 Rust 工具链与 wasm 目标 (${{ needs.resolve.outputs.rust_version }})
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ needs.resolve.outputs.rust_version }}
          targets: wasm32-unknown-unknown

      - name: 配置 Python 3.12 环境
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: 下载各平台 SDK 切片构件
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-leg-*
          path: legs

      - name: 汇总切片、打包 API 源码并生成官方标准 sdk.json 索引
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT_ABS="$(pwd)/dist"
          cd upstream
          echo "==> 汇总各平台 SDK 切片..."
          python3 tools/prebuilt_game.py gather ../legs "$OUT_ABS"

          echo "==> 构建与打包完整 Mod API 源代码..."
          python3 tools/sdk_api_source.py build "$RUNNER_TEMP/api-source"
          python3 tools/sdk_api_source.py archive "$RUNNER_TEMP/api-source" "$OUT_ABS/api-source.tar.xz"

          echo "==> 生成官方标准 sdk.json 索引..."
          python3 tools/prebuilt_game.py index "$OUT_ABS"

          echo "==> 完整 SDK 目录："
          ls -lh "$OUT_ABS"

      - name: 实时发布 SDK 核心索引与元数据至 GitHub Release
        if: needs.resolve.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          echo "==> [实时上传] 正在上传 sdk.json, surface.json, build-data 及 api-source 至 Release $TAG..."
          gh release upload "$TAG" dist/sdk.json dist/surface.json dist/build-data.tar.xz dist/api-source.tar.xz --repo "$GH_REPO" --clobber

      - name: 上传标准 Mod SDK 构件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-indexed
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: 发布统一 GitHub Release
    needs: [resolve, build-binaries, build-sdk-slices, index-sdk]
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (needs.build-binaries.result == 'success' || needs.build-binaries.result == 'skipped') &&
      (needs.index-sdk.result == 'success' || needs.index-sdk.result == 'skipped') &&
      needs.resolve.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出本仓库上下文环境
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 下载所有编译产物构件
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded

      - name: 汇总发布资产并生成统一 SHA256SUMS 校验文件
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # 展平所有构件文件到 release-assets 目录
          find downloaded/ -type f -exec cp -f {} release-assets/ \;
          rm -rf downloaded

          cd release-assets
          rm -f *.sha256 SHA256SUMS*
          sha256sum * > SHA256SUMS
          echo "=== 发布资产清单 ==="
          ls -lh
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: 创建或更新 GitHub Release 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ needs.resolve.outputs.repo }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          UPSTREAM_NIGHTLY: ${{ needs.resolve.outputs.upstream_nightly }}
          UPSTREAM_DATE: ${{ needs.resolve.outputs.upstream_date }}
          RUST_VER: ${{ needs.resolve.outputs.rust_version }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          ## 📌 上游基线版本
          - **上游版本标识**：\`${UPSTREAM_NIGHTLY}\`
          - **上游提交时间**：\`${UPSTREAM_DATE}\`
          - **上游源码链接**：[${REPO}@${SHORT_SHA}](https://github.com/${REPO}/commit/${SHA})
          - **Rust 编译工具链**：\`${RUST_VER}\`

          ## 🛠️ 下游定制特性与补丁
          - **\`printer-fix.patch\`**：
            - \`PACKETS_PER_TICK\` 发包上限提升至 \`5000\`（官方原为 400），彻底消除投影（Litematica Printer）高频发包引起的队列严重积压滞后。
            - 解除动作包（\`S::Attack\`, \`S::PlayerAction\`, \`S::UseItem\` 等）对移动包（Move）的按 Tick 阻塞滞留。
            - 允许同一 Tick 多次位移以最新位置覆盖，防止高频放置方块位移时被服务器误判踢出（\`invalid_player_movement\`）。

          ## 💻 目标平台架构
          - **AMD64 (x86_64)**：\`x86_64-unknown-linux-gnu\`
          - **ARM64 (aarch64)**：\`aarch64-unknown-linux-gnu\`

          ## 📦 发布文件资产清单
          ### 服务端与引擎安装包
          - \`horizon-server-linux-x86_64.tar.gz\`：Linux AMD64 专用服务端标准包（包含 \`horizon-engine\`, \`horizon-server\`, \`horizon-ctl\`, \`horizon-prepare\`）
          - \`horizon-linux-x86_64.tar.gz\`：Linux AMD64 无头客户端与服务端核心套件
          - \`horizon-server-linux-arm64.tar.gz\`：Linux ARM64 专用服务端标准包
          - \`horizon-linux-arm64.tar.gz\` / \`horizon-headless-server-linux-arm64.tar.gz\`：Linux ARM64 无头客户端与服务端核心套件

          ### 官方标准原生 Mod SDK
          - \`sdk.json\`：官方标准资产索引清单（由 \`xtask sdk-index\` 生成，完全兼容 \`cargo-horizon-mod\` 与官方模组加载规范）
          - \`surface.json\`：模组 API 表面定义
          - \`build-data.tar.xz\`：点位、循环与内部方法元数据
          - \`api-source.tar.xz\`：生成的完整 Mod API 源代码
          - **预编译动态库切片 (运行时 / API / 引擎)**：
            - AMD64: \`*-x86_64-unknown-linux-gnu*.tar.xz\`
            - ARM64: \`*-aarch64-unknown-linux-gnu*.tar.xz\`

          ### 完整性校验
          - \`SHA256SUMS\`：本版本所有发布资产的统一 SHA-256 校验清单
          EOF
          )

          TITLE="Horizon Server & SDK · ${UPSTREAM_NIGHTLY}"

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已经存在，更新产物、标题与说明..."
            gh release upload "$TAG" release-assets/* --repo "$GH_REPO" --clobber
            gh release edit "$TAG" --repo "$GH_REPO" --title "$TITLE" --notes "$NOTES"
          else
            echo "创建新 Release $TAG: $TITLE..."
            gh release create "$TAG" release-assets/* \
              --repo "$GH_REPO" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
